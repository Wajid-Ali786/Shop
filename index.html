<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Karyana shop ke liye product aur stock management" />

    <title>Karyana Shop</title>

    <link rel="icon" type="image/png" href="assets/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Karyana" />

    <link rel="stylesheet" href="css/app.css" />

    <!--
      Theme ko HTML parse hote hi laga dete hain, warna page pehle safed
      chamakta hai phir dark hota hai.
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('karyana.theme') || 'system'
          var dark =
            saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var lang = localStorage.getItem('karyana.lang')
          if (lang === 'ur') {
            document.documentElement.lang = 'ur'
            document.documentElement.dir = 'rtl'
          }
        } catch (e) {}
      })()
    </script>
  </head>

  <body>
    hy
    <div id="app">
      <div class="loading"><div class="spinner"></div></div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
